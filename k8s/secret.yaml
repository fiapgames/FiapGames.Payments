# Sample manifest for local/dev use. In the orchestration repo this should be
# replaced by a Secret generated from a vault/CI pipeline, never committed with real values.
apiVersion: v1
kind: Secret
metadata:
  name: payments-api-secrets
  namespace: fiapgames
  labels:
    app: payments-api
type: Opaque
stringData:
  RabbitMq__UserName: "fiapgames-admin"
  RabbitMq__Password: "FiapGames@Admin123"
  ConnectionStrings__Postgres: "Host=postgres.fiapgames.svc.cluster.local;Port=5432;Database=fiapgames-payments;Username=fiapgames-admin;Password=FiapGames@Admin123"
  # Chave da Azure Function de notificações. Vazia de propósito — é um segredo
  # externo de verdade (não um dev password local), então nunca é commitada com
  # valor real. Antes de aplicar: kubectl create secret ... --dry-run=client -o
  # yaml | kubectl apply -f -, ou edite localmente sem versionar a mudança.
  Notifications__FunctionKey: ""
